<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0814" />
  <meta name="robots" content="noindex" />
  <title>You’re on the list — Harmonic Affirmations</title>
  <style>
    :root {
      --bg: #0d0814;
      --gold: #d4af77;
      --gold-soft: rgba(212, 175, 119, 0.22);
      --amethyst: #a78bfa;
      --cream: #f7f4ef;
      --muted: rgba(247, 244, 239, 0.62);
      --faint: rgba(247, 244, 239, 0.38);
      --serif: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 26rem;
      height: 26rem;
      top: -6rem;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      filter: blur(80px);
      background: radial-gradient(circle, rgba(167, 139, 250, 0.32), transparent 70%);
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2.5rem 1.4rem;
    }

    .mark-h {
      width: 1.9rem;
      height: 1.9rem;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: 1.05rem;
      margin: 0 auto 1.6rem;
    }

    .kicker {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.1rem, 7vw, 3rem);
      line-height: 1.18;
      margin: 0.8rem 0 1rem;
    }

    p {
      color: var(--muted);
      max-width: 26rem;
      margin: 0 auto 1.8rem;
      font-size: 1.05rem;
    }

    a.home {
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.04em;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--gold-soft);
      padding-bottom: 0.15rem;
    }

    a.home:hover { border-bottom-color: var(--gold); }

    footer {
      position: absolute;
      bottom: 1.6rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--faint);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><div class="orb"></div></div>
  <div class="wrap">
    <div class="mark-h">h</div>
    <p class="kicker">Harmonic Affirmations</p>
    <h1>You’re on the list.</h1>
    <p>We’ll email you when the app launches. One note, on that day. Nothing else.</p>
    <a class="home" href="index.html">Back home</a>
    <footer>© 2026 C.B.Mack</footer>
  </div>
</body>
</html>
